<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04060d">
  <title>Photon</title>
  <link rel="icon" type="image/png" href="photon-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before the page draws, so it never flashes the wrong one.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('photon.theme') || 'system'; } catch (e) { /* storage blocked */ }
      var dark = pref === 'dark' || (pref === 'system' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePref = pref;
    })();
  </script>
  <link rel="stylesheet" href="photon.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#rooms" aria-label="Photon home">
      <img class="brand-mark" src="photon-mark.png" alt="" width="34" height="34">
      <span class="brand-word">Photon</span>
    </a>
    <span class="version" id="appVersion" title="Photon version"></span>
    <span class="page-title" id="pageTitle"></span>
    <nav class="tabs" aria-label="Sections">
      <a href="#rooms" data-view="rooms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>
        <span>Rooms</span></a>
      <a href="#connections" data-view="connections">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
        <span>Connections</span></a>
      <a href="#activity" data-view="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
        <span>Activity</span></a>
    </nav>
    <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="system" title="Match this device" aria-label="Match this device">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button type="button" data-theme-choice="light" title="Light" aria-label="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      </button>
      <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="theme.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
