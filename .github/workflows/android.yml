# Builds the Android app and tests it on Android emulators.
# Runs when the app or Photon changes, or by hand from the Actions tab.
# The APK it makes is signed with a throwaway test key; release APKs are signed separately
# (see android/README.md).
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

# A newer push replaces a run that's still going.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-build-tools android-sdk-platform-23 android-framework-res \
            apksigner zipalign dalvik-exchange clang lld patchelf zip
      - name: Build the APK
        run: bash android/build-apk.sh
      - uses: actions/upload-artifact@v5
        with:
          name: photon-apk
          path: dist/Photon-*.apk

  test:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: photon-apk
          path: dist
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/test/emulator-test.sh "$(ls dist/Photon-*.apk | head -1)" android-test-results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-test-results-api${{ matrix.api-level }}
          path: android-test-results
      # TEMPORARY: puts the screenshots on a branch so they can be looked at in the browser.
      - name: Publish screenshots
        if: always()
        run: |
          mkdir shots && cp android-test-results/*.png shots/ && cd shots
          git init -q -b ci-screens-api${{ matrix.api-level }}
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots from run ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD
